name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Les tests passent entièrement par une base SQLite en mémoire (voir
      # tests/conftest.py) : DATABASE_URL n'est jamais réellement utilisée.
      # SECRET_KEY n'a pas de valeur par défaut dans app/core/config.py, il
      # faut donc en fournir une ici — sans rapport avec la clé de prod.
      SECRET_KEY: ci-only-secret-key-jamais-utilisee-en-production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la suite de tests
        run: pytest -q

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      - name: Build de production (inclut la vérification des types)
        run: npm run build

  deploy:
    name: Déploiement (VPS)
    # Seulement sur un vrai push sur main (jamais sur une pull request, même
    # si elle cible main) et seulement si backend ET frontend sont au vert —
    # jamais de déploiement d'un code qui n'a pas passé les tests.
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Se connecter en SSH et lancer le script de déploiement
        uses: appleboy/ssh-action@v1
        with:
          host: 169.58.18.34
          username: legrand
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # deploy.sh (sur le serveur) : git pull, dépendances, migrations,
          # redémarrage des services, rebuild du frontend. Voir /opt/my-nkap/deploy.sh.
          script: /opt/my-nkap/deploy.sh
