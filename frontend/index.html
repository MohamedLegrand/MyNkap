<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <!-- maximum-scale=1 + user-scalable=no : empêche le pinch-to-zoom et le
         double-tap-to-zoom sur iOS Safari, qui cassaient la mise en page
         responsive (l'utilisateur pouvait zoomer/dézoomer librement). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Titre par défaut uniquement : la description est gérée exclusivement
         par react-helmet-async (voir src/components/Seo.tsx), une par page.
         Une balise meta description statique ici en plus de celle injectée
         par Helmet créait deux balises meta[name=description] en même temps
         — les navigateurs/robots ne lisent que la première (l'ancienne,
         statique), rendant la personnalisation par page invisible pour
         Google. -->
    <title>MyNkap — Gestion des finances personnelles intelligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
